# Sitio estático: no hay build, Netlify publica la carpeta raíz tal cual.
[build]
  publish = "."
  command = ""

# Atajo: tusitio.netlify.app/demo lleva al login de la app.
[[redirects]]
  from = "/demo"
  to = "https://agropulsenoa.netlify.app/login"
  status = 302

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
